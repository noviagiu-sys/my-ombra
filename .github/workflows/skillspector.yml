name: SkillSpector
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SkillSpector / skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned scanner
        run: python -m pip install "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@d162d9b343e559be13df8ebba093df3bc9d58c90"
      - name: Scan tracked skill bundles
        run: python .github/scripts/scan_skills.py
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillspector-reports
          path: skillscan-reports/
          if-no-files-found: warn
          retention-days: 14
