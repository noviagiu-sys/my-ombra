<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Ombra"/>
<title>Ombra - Distracted Walking Guard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #03040A;
  --bg2: #08090F;
  --glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.10);
  --green: #00FF94;
  --warn: #FFB300;
  --red: #FF1744;
  --cyan: #00E5FF;
  --text: #E8EAED;
  --muted: #606470;
  --dim: #181B24;
  --font: 'Orbitron', monospace;
  --body: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overflow: auto; }
body { font-family: var(--body); color: var(--text); -webkit-tap-highlight-color: transparent; }
button { border: none; outline: none; cursor: pointer; font-family: var(--body); }
input { outline: none; font-family: var(--mono); }
::-webkit-scrollbar { width: 0; }
#app {
  max-width: 430px; margin: 0 auto;
  min-height: 100dvh; display: flex; flex-direction: column;
  position: relative; overflow: auto;
}
#header {
  padding: 12px 18px 10px;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; transition: border-color .4s, background .4s;
  z-index: 20;
}
#header h1 { font-family: var(--font); font-size: 15px; letter-spacing: 3px; color: var(--text); }
#header-sub { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }
#status-badge {
  font-family: var(--font); font-size: 10px; letter-spacing: 2px;
  padding: 5px 14px; border-radius: 20px;
  background: rgba(0,255,148,.12); border: 1px solid rgba(0,255,148,.4);
  color: var(--green); transition: all .4s;
}
#cam-area {
  flex: 1; position: relative; background: #020307;
  overflow: hidden; min-height: 200px;
}
#video {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transform: scaleX(-1);
}
#video.rear { transform: none; }
#canvas { display: none; }
#hud {
  position: absolute; inset: 0; pointer-events: none;
  display: none; flex-direction: column; justify-content: space-between;
  padding: 12px;
}
#hud.visible { display: flex; }
#scanline {
  position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--green) 50%, transparent);
  animation: scanDown 3s linear infinite;
  opacity: .6;
}
@keyframes scanDown { 0%{top:0} 100%{top:100%} }
.bracket {
  position: absolute; width: 22px; height: 22px;
  border-color: var(--hud-color, var(--green));
  border-style: solid; transition: border-color .4s;
}
.bracket.tl { top:8px; left:8px; border-width:2px 0 0 2px; }
.bracket.tr { top:8px; right:8px; border-width:2px 2px 0 0; }
.bracket.bl { bottom:8px; left:8px; border-width:0 0 2px 2px; }
.bracket.br { bottom:8px; right:8px; border-width:0 2px 2px 0; }
#level-pill {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 2px;
  padding: 4px 18px; border-radius: 20px;
  background: rgba(0,255,148,.15); border: 1px solid var(--green);
  color: var(--green); transition: all .4s; white-space: nowrap;
}
#detection-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(3,4,10,.88); border-top: 1px solid rgba(255,255,255,.08);
  padding: 10px 14px; backdrop-filter: blur(10px);
}
#detection-text {
  font-family: var(--body); font-size: 13px; color: var(--text);
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
}
#detection-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); flex-shrink: 0; transition: background .3s;
}
#direction-label {
  font-family: var(--mono); font-size: 10px; color: var(--green);
  letter-spacing: 1px; transition: color .3s;
}
#no-cam {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; color: var(--muted);
}
#no-cam .icon { font-size: 48px; }
#no-cam p { font-size: 13px; text-align: center; padding: 0 32px; line-height: 1.5; }
#controls {
  flex-shrink: 0; padding: 14px 18px 18px;
  background: var(--bg2); border-top: 1px solid var(--border);
}
#main-btn {
  width: 100%; padding: 17px 0; border-radius: 14px;
  font-family: var(--font); font-size: 13px; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(135deg,rgba(0,255,148,.2),rgba(0,255,148,.08));
  border: 2px solid var(--green); color: var(--green);
  box-shadow: 0 0 32px rgba(0,255,148,.25);
  transition: all .4s; margin-bottom: 12px;
  position: relative; overflow: hidden;
}
#main-btn.active {
  background: linear-gradient(135deg,rgba(255,23,68,.2),rgba(255,23,68,.08));
  border-color: var(--red); color: var(--red);
  box-shadow: 0 0 32px rgba(255,23,68,.25);
}
#settings-row {
  display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
}
.sens-btn {
  flex: 1; padding: 7px 0; border-radius: 8px;
  font-family: var(--mono); font-size: 10px;
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  transition: all .2s;
}
.sens-btn.active {
  border-color: var(--cyan); background: rgba(0,229,255,.12);
  color: var(--cyan);
}
#cam-flip-btn {
  padding: 7px 12px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--border);
  color: var(--muted); font-size: 16px;
}
#pip-btn {
  padding: 7px 12px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--border);
  color: var(--muted); font-size: 12px; font-family: var(--mono);
  transition: all .3s;
}
#key-row {
  display: flex; gap: 8px; align-items: center;
}
#key-input {
  flex: 1; padding: 7px 10px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--border);
  color: var(--text); font-size: 12px;
  transition: border-color .2s;
}
#key-input:focus { border-color: var(--cyan); }
#key-status {
  font-family: var(--mono); font-size: 10px;
  white-space: nowrap;
}
#key-toggle {
  padding: 7px 12px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--border);
  color: var(--muted); font-size: 11px; font-family: var(--mono);
}
#log {
  max-height: 100px; overflow-y: auto;
  padding: 8px 18px; border-top: 1px solid var(--border);
  background: var(--bg); flex-shrink: 0; display: none;
}
#log.visible { display: block; }
.log-entry {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.04);
}
.log-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.log-time { font-family: var(--mono); font-size: 9px; color: var(--muted); flex-shrink: 0; }
.log-text { font-family: var(--body); font-size: 11px; color: var(--text); flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-dir { font-family: var(--mono); font-size: 9px; flex-shrink: 0; }
#danger-flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: rgba(255,23,68,.12); opacity: 0;
  animation: none;
}
#danger-flash.active { animation: dFlash .5s ease-in-out infinite; }
@keyframes dFlash { 0%,100%{opacity:0} 50%{opacity:1} }
#warn-banner {
  position: absolute; top: 0; left: 0; right: 0; z-index: 30;
  background: var(--warn); color: #000;
  font-family: var(--font); font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-align: center; padding: 8px;
  transform: translateY(-100%); transition: transform .3s;
}
#warn-banner.visible { transform: translateY(0); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
.level-sicher { --hud-color: var(--green); }
.level-achtung { --hud-color: var(--warn); }
.level-stopp { --hud-color: var(--red); }
#plugin-btn {
  padding: 7px 12px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--border);
  color: var(--muted); font-size: 11px; font-family: var(--mono);
  transition: all .3s; white-space: nowrap;
}
#plugin-btn.has-plugins { border-color: var(--cyan); color: var(--cyan); }
#plugin-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.80); backdrop-filter: blur(4px);
  align-items: flex-end; justify-content: center;
}
#plugin-overlay.visible { display: flex; }
#plugin-panel {
  width: 100%; max-width: 430px;
  background: #07080F; border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  max-height: 78vh; display: flex; flex-direction: column;
}
#plugin-panel-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#plugin-panel-title {
  font-family: var(--font); font-size: 11px; letter-spacing: 3px; color: var(--cyan);
}
#plugin-close-btn {
  padding: 4px 10px; background: transparent;
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--muted); font-size: 11px; font-family: var(--mono); cursor: pointer;
}
#plugin-output {
  flex: 1; overflow-y: auto; padding: 10px 16px;
  font-family: var(--mono); font-size: 11px; line-height: 1.75;
  min-height: 100px;
}
.pl { display: block; }
.pl.cmd { color: var(--cyan); }
.pl.ok  { color: var(--green); }
.pl.err { color: var(--red); }
.pl.inf { color: var(--muted); }
.pl.wrn { color: var(--warn); }
#plugin-input-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 22px; border-top: 1px solid var(--border); flex-shrink: 0;
}
#plugin-prompt { font-family: var(--mono); font-size: 13px; color: var(--cyan); flex-shrink: 0; }
#plugin-input {
  flex: 1; background: transparent; border: none;
  color: var(--text); font-family: var(--mono); font-size: 12px;
  caret-color: var(--cyan);
}
</style>
</head>
<body>
<div id="danger-flash"></div>
<div id="warn-banner">SCHAU AUF DEN WEG!</div>
<div id="app">
  <div id="header">
    <div>
      <h1>OMBRA</h1>
      <div id="header-sub">DISTRACTED WALKING GUARD</div>
    </div>
    <div id="status-badge">BEREIT</div>
  </div>
  <div id="cam-area">
    <video id="video" autoplay playsinline muted webkit-playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="no-cam">
      <div class="icon">&#x1F4F7;</div>
      <p>Kamera-Zugriff noetig.<br/>Aktiviere den Schutz um zu starten.</p>
    </div>
    <div id="hud">
      <div id="scanline"></div>
      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>
      <div id="level-pill">FREI</div>
      <div style="position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="font-family:var(--mono);font-size:8px;color:var(--muted);writing-mode:vertical-rl;letter-spacing:1px;margin-bottom:4px">THREAT</div>
        <div style="width:6px;height:80px;background:var(--dim);border-radius:3px;overflow:hidden;position:relative">
          <div id="threat-bar" style="position:absolute;bottom:0;left:0;right:0;height:0%;background:var(--green);transition:height .8s,background .4s;box-shadow:0 0 8px var(--green)"></div>
        </div>
        <div id="threat-pct" style="font-family:var(--mono);font-size:8px;color:var(--green);transition:color .3s">0%</div>
      </div>
      <div id="analyzing-dot" style="position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--warn);display:none;animation:blink .5s infinite"></div>
      <div id="detection-bar">
        <div id="detection-text">
          <div id="detection-dot"></div>
          <span id="detection-msg">Beobachte Umgebung...</span>
        </div>
        <div id="direction-label"></div>
      </div>
    </div>
  </div>
  <div id="log"></div>
  <div id="controls">
    <div id="settings-row">
      <span style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;flex-shrink:0">INTERVALL</span>
      <button class="sens-btn" data-s="2000">2s</button>
      <button class="sens-btn active" data-s="3500">3.5s</button>
      <button class="sens-btn" data-s="6000">6s</button>
      <button id="cam-flip-btn" title="Kamera wechseln">&#x1F504;</button>
      <button id="pip-btn" title="Picture-in-Picture">&#x1FA9F; PiP</button>
      <button id="plugin-btn" title="Plugin Terminal">&#x2B21; PLUG</button>
    </div>
    <div id="key-row" style="margin-bottom:12px">
      <input id="key-input" type="password" placeholder="sk-ant-api03-... (Anthropic Key)"/>
      <div id="key-status" style="color:var(--muted)">KEIN KEY</div>
      <button id="key-toggle">EDIT</button>
    </div>
    <button id="main-btn">SCHUTZ AKTIVIEREN</button>
  </div>
</div>

<div id="plugin-overlay">
  <div id="plugin-panel">
    <div id="plugin-panel-hdr">
      <span id="plugin-panel-title">PLUGIN TERMINAL</span>
      <button id="plugin-close-btn">&#x2715; CLOSE</button>
    </div>
    <div id="plugin-output"></div>
    <div id="plugin-input-row">
      <span id="plugin-prompt">&#x203A;</span>
      <input id="plugin-input" type="text" placeholder="marketplace add &lt;url&gt; | install &lt;name&gt;@&lt;reg&gt;" autocomplete="off" spellcheck="false"/>
    </div>
  </div>
</div>

<script>
var active = false;
var stream = null;
var loopTimer = null;
var interval = 3500;
var facing = 'environment';
var apiKey = localStorage.getItem('ombra_key') || '';
var showKey = false;
var logData = [];
var analyzing = false;
var lastLevel = 'frei';
var scanCount = 0;

var LV = {
  frei: { color:'#00FF94', pct:0, label:'\u25CF FREI', dir:'' },
  achtung: { color:'#FFB300', pct:60, label:'\u25CF ACHTUNG', dir:'' },
  stopp: { color:'#FF1744', pct:100, label:'\u25CF STOPP', dir:'' }
};

var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var hud = document.getElementById('hud');
var noCam = document.getElementById('no-cam');
var mainBtn = document.getElementById('main-btn');
var statusBadge = document.getElementById('status-badge');
var levelPill = document.getElementById('level-pill');
var detDot = document.getElementById('detection-dot');
var detMsg = document.getElementById('detection-msg');
var dirLabel = document.getElementById('direction-label');
var threatBar = document.getElementById('threat-bar');
var threatPct = document.getElementById('threat-pct');
var analDot = document.getElementById('analyzing-dot');
var warnBanner = document.getElementById('warn-banner');
var dangerFlash = document.getElementById('danger-flash');
var logEl = document.getElementById('log');
var keyInput = document.getElementById('key-input');
var keyStatus = document.getElementById('key-status');
var keyToggle = document.getElementById('key-toggle');
var camFlip = document.getElementById('cam-flip-btn');
var header = document.getElementById('header');

if (apiKey) {
  keyInput.value = apiKey;
  updateKeyStatus();
}

keyInput.addEventListener('input', function() {
  apiKey = keyInput.value.trim();
  localStorage.setItem('ombra_key', apiKey);
  updateKeyStatus();
});

keyToggle.addEventListener('click', function() {
  showKey = !showKey;
  keyInput.style.display = showKey ? 'block' : 'none';
  keyToggle.textContent = showKey ? 'OK' : 'EDIT';
});
keyInput.style.display = 'none';

function updateKeyStatus() {
  if (apiKey && apiKey.startsWith('sk-ant')) {
    keyStatus.textContent = '\u2713 KEY OK';
    keyStatus.style.color = '#00FF94';
  } else if (apiKey) {
    keyStatus.textContent = '\u26A0 FORMAT?';
    keyStatus.style.color = '#FFB300';
  } else {
    keyStatus.textContent = 'DEMO';
    keyStatus.style.color = '#606470';
  }
}

document.querySelectorAll('.sens-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.sens-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    interval = parseInt(btn.dataset.s);
    if (active) restartLoop();
  });
});

camFlip.addEventListener('click', async function() {
  facing = facing === 'environment' ? 'user' : 'environment';
  video.className = facing === 'user' ? '' : 'rear';
  if (active) {
    if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
    await startCamera();
  }
});

mainBtn.addEventListener('click', function() {
  if (active) stopProtection();
  else startProtection();
});

async function startProtection() {
  var ok = await startCamera();
  if (!ok) return;
  active = true;
  mainBtn.classList.add('active');
  mainBtn.textContent = '\u23F9  SCHUTZ DEAKTIVIEREN';
  hud.classList.add('visible');
  noCam.style.display = 'none';
  setLevel('frei', 'Kamera aktiv \u2014 scanne Umgebung', '--');
  playTone(520, 0.15);
  setTimeout(function() { playTone(660, 0.2); }, 180);
  startLoop();
}

function stopProtection() {
  active = false;
  if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
  stream = null;
  clearInterval(loopTimer);
  mainBtn.classList.remove('active');
  mainBtn.textContent = '\u25B6  SCHUTZ AKTIVIEREN';
  hud.classList.remove('visible');
  noCam.style.display = 'flex';
  statusBadge.textContent = '\u25CF BEREIT';
  statusBadge.style.cssText = '';
  header.style.cssText = '';
  dangerFlash.classList.remove('active');
  warnBanner.classList.remove('visible');
  setLevel('frei', '', '--');
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
    video.srcObject = stream;
    await video.play();
    video.className = facing === 'user' ? '' : 'rear';
    return true;
  } catch (e) {
    console.warn('Camera error:', e.name, e.message);
    noCam.querySelector('p').textContent = 'Demo-Modus aktiv \u2014 Kamera nicht verf\u00FCgbar. Simulierte Erkennung l\u00E4uft.';
    return true;
  }
}

function startLoop() {
  clearInterval(loopTimer);
  doAnalysis();
  loopTimer = setInterval(doAnalysis, interval);
}

function restartLoop() {
  clearInterval(loopTimer);
  loopTimer = setInterval(doAnalysis, interval);
}

async function doAnalysis() {
  if (analyzing) return;
  analyzing = true;
  analDot.style.display = 'block';
  scanCount++;
  try {
    var b64 = captureFrame();
    if (b64 && apiKey && apiKey.startsWith('sk-ant')) {
      var result = await callClaude(b64);
      applyResult(result);
    } else {
      await sleep(400);
      var r = Math.random();
      if (r < 0.60) applyResult({ level:'frei', object:'Weg ist frei', direction:'--', distance:'--' });
      else if (r < 0.82) applyResult({ level:'achtung', object:'Fahrrad n\u00E4hert sich', direction:'links', distance:'mittel' });
      else applyResult({ level:'stopp', object:'Fahrzeug direkt vor dir!', direction:'mitte', distance:'nah' });
    }
  } catch(e) {
    console.warn('Analysis error:', e);
  }
  analyzing = false;
  analDot.style.display = 'none';
}

function captureFrame() {
  if (!video.videoWidth) return null;
  canvas.width = 320;
  canvas.height = 240;
  var ctx = canvas.getContext('2d');
  if (facing === 'user') {
    ctx.translate(320, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, 320, 240);
  return canvas.toDataURL('image/jpeg', 0.65).split(',')[1];
}

async function callClaude(b64) {
  var res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 120,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
          { type: 'text', text: 'Sch\u00FCtze Fussg\u00E4nger die auf ihr Handy schauen. Analysiere das Kamerabild (Blickrichtung: nach vorne beim Gehen). Erkenne: Fahrzeuge (Auto/Tram/Bus), Fahrr\u00E4der, E-Scooter, Personen im Weg, rote Ampel, Stufen/Bordstein, Hindernisse. Antworte NUR als kompaktes JSON ohne Markdown: {"level":"frei"|"achtung"|"stopp","object":"was auf deutsch","direction":"links|mitte|rechts|--","distance":"nah|mittel|weit|--"} Regeln: frei=nichts gef\u00E4hrliches nah, achtung=Objekt n\u00E4hert sich von Seite/hinten, stopp=unmittelbare Gefahr direkt vor dir' }
        ]
      }]
    })
  });
  var d = await res.json();
  var txt = (d.content && d.content[0] && d.content[0].text) || '{}';
  try { return JSON.parse(txt); } catch(e) { return { level:'frei', object:'Analyse-Fehler', direction:'--', distance:'--' }; }
}

function applyResult(r) {
  var lv = r.level || 'frei';
  var obj = r.object || '';
  var dir = r.direction || '--';
  setLevel(lv, obj, dir);
  if (lv !== 'frei' && (lv !== lastLevel || lv === 'stopp')) {
    playAlert(lv);
    if (navigator.vibrate) navigator.vibrate(lv === 'stopp' ? [200,100,200,100,200] : [80,60,80]);
    addLog(lv, obj, dir);
  }
  lastLevel = lv;
}

function setLevel(lv, msg, dir) {
  var L = LV[lv] || LV.frei;
  levelPill.textContent = L.label;
  levelPill.style.color = L.color;
  levelPill.style.borderColor = L.color;
  levelPill.style.background = L.color + '22';
  detDot.style.background = L.color;
  detMsg.textContent = msg || 'Beobachte Umgebung...';
  var dirMap = { 'links':'\u2190 VON LINKS', 'mitte':'\u2191 VON VORNE', 'rechts':'VON RECHTS \u2192', '--':'' };
  dirLabel.textContent = dirMap[dir] || '';
  dirLabel.style.color = L.color;
  threatBar.style.height = L.pct + '%';
  threatBar.style.background = L.color;
  threatBar.style.boxShadow = '0 0 8px ' + L.color;
  threatPct.textContent = L.pct + '%';
  threatPct.style.color = L.color;
  document.querySelectorAll('.bracket').forEach(function(b) { b.style.borderColor = L.color; });
  statusBadge.textContent = '\u25CF ' + lv.toUpperCase();
  statusBadge.style.color = L.color;
  statusBadge.style.borderColor = L.color + '66';
  statusBadge.style.background = L.color + '22';
  if (lv === 'stopp') {
    header.style.background = '#130005';
    header.style.borderBottomColor = L.color + '66';
  } else if (lv === 'achtung') {
    header.style.background = '#110900';
    header.style.borderBottomColor = L.color + '44';
  } else {
    header.style.background = '';
    header.style.borderBottomColor = '';
  }
  if (lv === 'stopp') {
    dangerFlash.classList.add('active');
    warnBanner.classList.add('visible');
    warnBanner.style.background = L.color;
  } else if (lv === 'achtung') {
    dangerFlash.classList.remove('active');
    warnBanner.classList.add('visible');
    warnBanner.style.background = '#FFB300';
    warnBanner.textContent = '\u26A0 ACHTUNG \u2014 ' + (msg || '').toUpperCase();
    setTimeout(function() { warnBanner.classList.remove('visible'); }, 3000);
  } else {
    dangerFlash.classList.remove('active');
    warnBanner.classList.remove('visible');
    warnBanner.textContent = '\u26A0 SCHAU AUF DEN WEG!';
  }
}

function addLog(lv, msg, dir) {
  var L = LV[lv] || LV.frei;
  var time = new Date().toLocaleTimeString('de', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var dirs = { 'links':'\u2190', 'mitte':'\u2191', 'rechts':'\u2192', '--':'' };
  logData.unshift({lv:lv, msg:msg, dir:dir, time:time});
  if (logData.length > 30) logData.pop();
  var html = '';
  for (var i = 0; i < Math.min(logData.length, 8); i++) {
    var e = logData[i];
    var c = (LV[e.lv] && LV[e.lv].color) || '#666';
    html += '<div class="log-entry"><div class="log-dot" style="background:' + c + '"></div><span class="log-time">' + e.time + '</span><span class="log-text">' + e.msg + '</span><span class="log-dir" style="color:' + c + '">' + (dirs[e.dir] || '') + '</span></div>';
  }
  logEl.innerHTML = html;
  logEl.classList.add('visible');
}

var actx = null;
function playTone(freq, dur, type, vol) {
  type = type || 'sine';
  vol = vol || 0.15;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e) {}
}

function playAlert(lv) {
  if (lv === 'achtung') {
    playTone(660, 0.25);
    setTimeout(function() { playTone(550, 0.25); }, 300);
  }
  if (lv === 'stopp') {
    setTimeout(function() { playTone(880, 0.15, 'square', 0.22); }, 0);
    setTimeout(function() { playTone(880, 0.15, 'square', 0.22); }, 150);
    setTimeout(function() { playTone(880, 0.15, 'square', 0.22); }, 300);
  }
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

var pipBtn = document.getElementById('pip-btn');
var pipCanvas = document.createElement('canvas');
pipCanvas.width = 320;
pipCanvas.height = 240;
var pipCtx = pipCanvas.getContext('2d');
var pipVideo = null;
var pipStream = null;
var pipLoop = null;

pipBtn.addEventListener('click', async function() {
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
      if (pipLoop) cancelAnimationFrame(pipLoop);
      pipBtn.style.borderColor = 'rgba(255,255,255,0.10)';
      pipBtn.style.color = '#606470';
      return;
    }
    if (!pipVideo) {
      pipVideo = document.createElement('video');
      pipVideo.muted = true;
      pipVideo.autoplay = true;
      pipVideo.playsInline = true;
    }
    pipStream = pipCanvas.captureStream(15);
    pipVideo.srcObject = pipStream;
    await pipVideo.play();
    function drawPiP() {
      if (video.videoWidth) {
        pipCtx.drawImage(video, 0, 0, 320, 240);
      }
      var colors = { frei:'#00FF94', achtung:'#FFB300', stopp:'#FF1744' };
      var c = colors[lastLevel] || '#00FF94';
      var lw = lastLevel === 'stopp' ? 8 : lastLevel === 'achtung' ? 5 : 2;
      pipCtx.strokeStyle = c;
      pipCtx.lineWidth = lw;
      pipCtx.strokeRect(0, 0, 320, 240);
      pipCtx.fillStyle = 'rgba(0,0,0,0.7)';
      pipCtx.fillRect(90, 4, 140, 24);
      pipCtx.font = 'bold 14px monospace';
      pipCtx.fillStyle = c;
      pipCtx.textAlign = 'center';
      pipCtx.fillText(lastLevel.toUpperCase(), 160, 21);
      if (lastLevel !== 'frei') {
        pipCtx.fillStyle = 'rgba(0,0,0,0.8)';
        pipCtx.fillRect(0, 200, 320, 40);
        pipCtx.font = '12px sans-serif';
        pipCtx.fillStyle = c;
        pipCtx.textAlign = 'center';
        var msg = document.getElementById('detection-msg').textContent;
        pipCtx.fillText(msg, 160, 224);
      }
      if (lastLevel === 'stopp' && Math.floor(Date.now()/300) % 2 === 0) {
        pipCtx.fillStyle = 'rgba(255,23,68,0.2)';
        pipCtx.fillRect(0, 0, 320, 240);
      }
      pipLoop = requestAnimationFrame(drawPiP);
    }
    drawPiP();
    await pipVideo.requestPictureInPicture();
    pipBtn.style.borderColor = '#00E5FF';
    pipBtn.style.color = '#00E5FF';
  } catch(e) {
    try {
      await video.requestPictureInPicture();
      pipBtn.style.borderColor = '#00E5FF';
      pipBtn.style.color = '#00E5FF';
    } catch(e2) {
      alert('PiP nicht verf\u00FCgbar auf diesem Ger\u00E4t.');
    }
  }
});

document.addEventListener('leavepictureinpicture', function() {
  if (pipLoop) cancelAnimationFrame(pipLoop);
  pipBtn.style.borderColor = 'rgba(255,255,255,0.10)';
  pipBtn.style.color = '#606470';
});

// ── Plugin System ──────────────────────────────────────────────────────────
var pluginMarket = JSON.parse(localStorage.getItem('ombra_market') || '[]');
var pluginInstalled = JSON.parse(localStorage.getItem('ombra_plugins') || '[]');
var pluginHooks = { onAnalysis: [], onLevel: [] };

var pluginOverlay = document.getElementById('plugin-overlay');
var pluginOutput  = document.getElementById('plugin-output');
var pluginInputEl = document.getElementById('plugin-input');
var pluginBtnEl   = document.getElementById('plugin-btn');

function saveMarket() { localStorage.setItem('ombra_market', JSON.stringify(pluginMarket)); }
function savePInstalled() { localStorage.setItem('ombra_plugins', JSON.stringify(pluginInstalled)); }

function pPrint(msg, cls) {
  var s = document.createElement('span');
  s.className = 'pl ' + (cls || 'inf');
  s.textContent = msg;
  pluginOutput.appendChild(s);
  pluginOutput.scrollTop = pluginOutput.scrollHeight;
}

function showPluginPanel() {
  pluginOverlay.classList.add('visible');
  if (pluginOutput.children.length === 0) {
    pPrint('OMBRA PLUGIN TERMINAL v1.0', 'ok');
    pPrint('Commands: marketplace add <url>  |  install <n>@<reg>  |  list  |  help', 'inf');
    pPrint('', 'inf');
    if (pluginInstalled.length) {
      pPrint('Active: ' + pluginInstalled.map(function(p){return p.id;}).join(', '), 'ok');
    }
  }
  setTimeout(function(){ pluginInputEl.focus(); }, 80);
}

function hidePluginPanel() { pluginOverlay.classList.remove('visible'); }

pluginBtnEl.addEventListener('click', showPluginPanel);
document.getElementById('plugin-close-btn').addEventListener('click', hidePluginPanel);
pluginOverlay.addEventListener('click', function(e){ if (e.target === pluginOverlay) hidePluginPanel(); });

function parseGHUrl(url) {
  var m = url.match(/github\.com\/([^\/\s]+)\/([^\/\s#?]+)/);
  if (!m) return null;
  return { owner: m[1], repo: m[2].replace(/\.git$/, '') };
}

function marketById(id) {
  return pluginMarket.find(function(e){ return e.id === id.toLowerCase(); });
}

function installedById(id) {
  return pluginInstalled.find(function(p){ return p.id === id.toLowerCase(); });
}

async function cmdMarketAdd(url) {
  pPrint('› marketplace add ' + url, 'cmd');
  var gh = parseGHUrl(url);
  if (!gh) { pPrint('✗ Invalid GitHub URL', 'err'); return; }
  var id = gh.repo.toLowerCase();
  if (marketById(id)) { pPrint('⚠ Already in marketplace: ' + id, 'wrn'); return; }
  pluginMarket.push({ id: id, name: gh.repo, owner: gh.owner, repo: gh.repo, url: url, added: Date.now() });
  saveMarket();
  pPrint('✓ Added to marketplace: ' + gh.repo + ' [id: ' + id + ']', 'ok');
  pPrint('  Source: ' + url, 'inf');
}

async function cmdInstall(spec) {
  pPrint('› install ' + spec, 'cmd');
  var parts = spec.split('@');
  var pid  = parts[0].trim().toLowerCase();
  var regId = (parts[1] || parts[0]).trim().toLowerCase();

  var entry = marketById(regId);
  if (!entry) {
    pPrint('✗ Marketplace entry not found: ' + regId, 'err');
    pPrint('  Hint: run  marketplace add <github-url>  first', 'inf');
    return;
  }
  if (installedById(pid)) { pPrint('⚠ Already installed: ' + pid, 'wrn'); return; }

  pPrint('⟳ Fetching plugin from ' + entry.owner + '/' + entry.repo + '…', 'inf');

  var candidates = ['ombra-plugin.js', 'plugin.js', 'index.js', 'main.js'];
  var branches   = ['main', 'master'];
  var code = null, srcFile = null;

  outer:
  for (var bi = 0; bi < branches.length; bi++) {
    var base = 'https://raw.githubusercontent.com/' + entry.owner + '/' + entry.repo + '/' + branches[bi] + '/';
    for (var ci = 0; ci < candidates.length; ci++) {
      try {
        var r = await fetch(base + candidates[ci]);
        if (r.ok) { code = await r.text(); srcFile = candidates[ci]; break outer; }
      } catch(e) {}
    }
  }

  if (!code) {
    pPrint('✗ No plugin file found in repository', 'err');
    pPrint('  Tried: ' + candidates.join(', ') + ' on branches main/master', 'inf');
    pPrint('  Ensure the repo is public and has a plugin entry point', 'inf');
    return;
  }

  pPrint('✓ Fetched ' + srcFile + ' (' + code.length + ' bytes)', 'ok');

  var api = {
    version: '1.0',
    pluginId: pid,
    onAnalysis: function(cb){ pluginHooks.onAnalysis.push(cb); },
    onLevel:    function(cb){ pluginHooks.onLevel.push(cb); },
    print: function(msg){ pPrint('[' + pid + '] ' + msg, 'inf'); },
    log:   function(lv, msg, dir){ addLog(lv, msg, dir); },
    getLevel: function(){ return lastLevel; }
  };

  try {
    (new Function('OmbraAPI', code))(api);
    pluginInstalled.push({ id: pid, registry: regId, file: srcFile, installed: Date.now() });
    savePInstalled();
    pluginBtnEl.classList.add('has-plugins');
    pPrint('✓ Plugin installed: ' + pid, 'ok');
  } catch(e) {
    pPrint('✗ Plugin runtime error: ' + e.message, 'err');
  }
}

function cmdList() {
  pPrint('› list', 'cmd');
  if (pluginInstalled.length) {
    pPrint('Installed (' + pluginInstalled.length + '):', 'ok');
    pluginInstalled.forEach(function(p){
      pPrint('  • ' + p.id + '  ← ' + p.registry + '  [' + p.file + ']', 'inf');
    });
  } else { pPrint('No plugins installed.', 'inf'); }
  if (pluginMarket.length) {
    pPrint('Marketplace (' + pluginMarket.length + '):', 'ok');
    pluginMarket.forEach(function(e){
      pPrint('  • ' + e.id + '  →  ' + e.url, 'inf');
    });
  } else { pPrint('Marketplace is empty.', 'inf'); }
}

function cmdHelp() {
  pPrint('Available commands:', 'ok');
  pPrint('  marketplace add <url>       Add GitHub repo to marketplace', 'inf');
  pPrint('  marketplace list            List marketplace entries', 'inf');
  pPrint('  marketplace remove <id>     Remove from marketplace', 'inf');
  pPrint('  install <name>@<registry>   Fetch & install plugin', 'inf');
  pPrint('  uninstall <name>            Remove installed plugin', 'inf');
  pPrint('  list                        Show all plugins & marketplace', 'inf');
  pPrint('  clear                       Clear terminal output', 'inf');
}

async function runCmd(raw) {
  var cmd = raw.trim();
  if (!cmd) return;
  if (cmd === 'help') { cmdHelp(); }
  else if (cmd === 'list') { cmdList(); }
  else if (cmd === 'clear') { pluginOutput.innerHTML = ''; }
  else if (cmd.startsWith('marketplace add ')) {
    await cmdMarketAdd(cmd.slice(16).trim());
  } else if (cmd === 'marketplace list') {
    if (!pluginMarket.length) { pPrint('Marketplace is empty.', 'inf'); }
    else pluginMarket.forEach(function(e){ pPrint('• ' + e.id + ': ' + e.url, 'inf'); });
  } else if (cmd.startsWith('marketplace remove ')) {
    var rid = cmd.slice(19).trim().toLowerCase();
    var ri = pluginMarket.findIndex(function(e){ return e.id === rid; });
    if (ri >= 0) { pluginMarket.splice(ri, 1); saveMarket(); pPrint('✓ Removed: ' + rid, 'ok'); }
    else pPrint('✗ Not found: ' + rid, 'err');
  } else if (cmd.startsWith('install ')) {
    await cmdInstall(cmd.slice(8).trim());
  } else if (cmd.startsWith('uninstall ')) {
    var uid = cmd.slice(10).trim().toLowerCase();
    var ui = pluginInstalled.findIndex(function(p){ return p.id === uid; });
    if (ui >= 0) { pluginInstalled.splice(ui, 1); savePInstalled(); pPrint('✓ Uninstalled: ' + uid, 'ok'); }
    else pPrint('✗ Not found: ' + uid, 'err');
    if (!pluginInstalled.length) pluginBtnEl.classList.remove('has-plugins');
  } else {
    pPrint('✗ Unknown: ' + cmd, 'err');
    pPrint('  Type "help" for commands', 'inf');
  }
}

pluginInputEl.addEventListener('keydown', async function(e) {
  if (e.key === 'Enter') {
    var v = pluginInputEl.value;
    pluginInputEl.value = '';
    await runCmd(v);
  }
});

if (pluginInstalled.length) pluginBtnEl.classList.add('has-plugins');

// Hook applyResult and setLevel for plugin callbacks
var _applyResult0 = applyResult;
applyResult = function(r) {
  _applyResult0(r);
  pluginHooks.onAnalysis.forEach(function(cb){ try{ cb(r); }catch(e){} });
};

var _setLevel0 = setLevel;
setLevel = function(lv, msg, dir) {
  _setLevel0(lv, msg, dir);
  pluginHooks.onLevel.forEach(function(cb){ try{ cb(lv, msg, dir); }catch(e){} });
};
</script>
